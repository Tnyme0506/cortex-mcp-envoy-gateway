# Envoy edge proxy for the Cortex API (+ future MCP HTTP endpoints).
# Clients hit :8088; Envoy routes /v1/cortex/* and /health to the API service.

static_resources:
  listeners:
    - name: cortex_gateway_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8088
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: cortex_gateway
                codec_type: AUTO
                route_config:
                  name: cortex_routes
                  virtual_hosts:
                    - name: cortex_service
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/health"
                          route:
                            cluster: cortex_api
                            timeout: 15s
                        - match:
                            prefix: "/v1/cortex/"
                          route:
                            cluster: cortex_api
                            timeout: 30s
                        - match:
                            prefix: "/docs"
                          route:
                            cluster: cortex_api
                        - match:
                            prefix: "/openapi.json"
                          route:
                            cluster: cortex_api
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: cortex_api
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: cortex_api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: api
                      port_value: 8080

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
